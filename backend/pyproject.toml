[project]
name = "katomaran-backend"
version = "0.1.0"
description = "Katomaran AI - Intelligent Face Tracker & Visitor Analytics (API + worker)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy>=2.0.36,<2.1",
    "alembic>=1.14,<2",
    "psycopg[binary]>=3.2,<4",
    "onnxruntime>=1.20",
    "opencv-python-headless>=4.10",
    "numpy>=2.0",
    "websockets>=13",
    "psutil>=6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    "pgserver>=0.1.4",
    "pytest-timeout>=2.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
timeout = 120
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: requires a real PostgreSQL database (TEST_DATABASE_URL / DATABASE_URL)",
    "model: requires the downloaded YOLO face model (scripts/download-model.ps1)",
    "e2e: runs the real API server, worker process logic, model and a sample video",
]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "E501"]
# Phase 3 modules: long explanatory comments/strings; code itself is formatted by ruff.
"app/services/identity_manager.py" = ["E501"]
"app/vision/recognition/*.py" = ["E501"]
"app/workers/*.py" = ["E501"]
"app/models/visitor.py" = ["E501"]
# Phase 4 modules: long explanatory comments/strings; code itself is formatted by ruff.
"app/models/visit.py" = ["E501"]
"app/schemas/events.py" = ["E501"]
"app/api/v1/events.py" = ["E501"]
"app/services/event_recorder.py" = ["E501"]
"app/services/visit_*.py" = ["E501"]
"app/services/session_manager.py" = ["E501"]
"app/core/events.py" = ["E501"]
"app/core/logging.py" = ["E501"]
"app/main.py" = ["E501"]
"app/core/config.py" = ["E501"]
"app/api/v1/ws.py" = ["E501"]
# Developer tools: long prose lines in the report text, deliberate subprocess calls (nvidia-smi/powershell).
"benchmarks/**" = ["E501", "S603", "S607", "S311", "E741"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]

[[tool.mypy.overrides]]
module = ["alembic.*", "onnxruntime.*", "pgserver.*"]
ignore_missing_imports = true

