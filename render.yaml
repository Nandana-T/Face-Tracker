# Render blueprint for the API (NOT applied automatically; no resources are provisioned by this repo).
# Secrets (DATABASE_URL, CORS_ORIGINS, WORKER_TOKEN) are set in the Render dashboard (sync: false).
# The AI worker is NOT deployed here: it runs next to the camera (or on a GPU host) and dials this API
# over wss:// with WORKER_TOKEN. Keep this service at ONE instance - live session state is in memory.
# UNVERIFIED: Docker is not installed on the development machine, so this blueprint has never been built.
services:
  - type: web
    name: katomaran-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    preDeployCommand: alembic upgrade head   # run from /app/backend (WORKDIR)
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: DB_USE_PGBOUNCER
        value: "false"
      - key: WORKER_TOKEN
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: AUTH_SECRET
        sync: false
      # Durable biometric evidence: a PRIVATE Supabase Storage bucket (the service-role key is a
      # server secret: it exists only on this service, never on the worker or in the frontend).
      - key: STORAGE_BACKEND
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: katomaran-evidence
    numInstances: 1
